spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/lumen
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=lumen
spring.datasource.password=lumen
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:lumen}
minio.secret-key=${MINIO_SECRET_KEY:lumen12345}
minio.bucket=${MINIO_BUCKET:lumen-user-visuals}
minio.presigned-url-expiry-seconds=${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:900}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
