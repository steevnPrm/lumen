services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lumen
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumen
      MINIO_ROOT_PASSWORD: lumen12345
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Conteneur one-shot : crée le bucket dédié aux visuels utilisateurs au démarrage,
  # pour que l'API n'ait pas à gérer le provisionnement du bucket elle-même.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lumen lumen12345 &&
      mc mb --ignore-existing local/lumen-user-visuals
      "

volumes:
  postgres-data:
  minio-data:
